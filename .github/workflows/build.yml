name: Mobile builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core openssl
      - run: QMAKE=qmake ./bin/test
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
          cache: true
      - name: Fetch pinned Android TLS libraries and license notices
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" ./bin/fetch-android-openssl
      - name: Build development APK
        env:
          QT_ANDROID: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          mkdir -p build
          cd build
          "$QT_ANDROID/bin/qmake" ../abm-mobile.pro CONFIG+=release CONFIG-=debug
          make -j4
          make INSTALL_ROOT="$PWD/android-build" install
          "$QT_HOST_PATH/bin/androiddeployqt" --input android-abm-mobile-deployment-settings.json --output android-build --android-platform android-35 --gradle
          mkdir -p ../dist
          cp android-build/build/outputs/apk/debug/*.apk ../dist/ABM-Mobile-0.2.0-Android-arm64-debug.apk
          cd ../dist
          sha256sum *.apk > SHA256SUMS
      - name: Optionally sign a reusable release APK
        if: github.event_name != 'pull_request'
        env:
          ABM_ANDROID_KEYSTORE_B64: ${{ secrets.ABM_ANDROID_KEYSTORE_B64 }}
          ABM_ANDROID_STORE_PASSWORD: ${{ secrets.ABM_ANDROID_STORE_PASSWORD }}
          ABM_ANDROID_KEY_ALIAS: ${{ secrets.ABM_ANDROID_KEY_ALIAS }}
          ABM_ANDROID_KEY_PASSWORD: ${{ secrets.ABM_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ABM_ANDROID_KEYSTORE_B64" ]; then
            echo 'No stable release signing key configured; development APK only.'
            exit 0
          fi
          test -n "$ABM_ANDROID_STORE_PASSWORD" && test -n "$ABM_ANDROID_KEY_ALIAS" && test -n "$ABM_ANDROID_KEY_PASSWORD"
          key="$RUNNER_TEMP/abm-release.keystore"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$ABM_ANDROID_KEYSTORE_B64" | base64 --decode > "$key"
          "$QT_HOST_PATH/bin/androiddeployqt" --input build/android-abm-mobile-deployment-settings.json --output build/android-build --android-platform android-35 --gradle --release
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 build/android-build/build/outputs/apk/release/*-unsigned.apk "$RUNNER_TEMP/abm-aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$ABM_ANDROID_KEY_ALIAS" --ks-pass env:ABM_ANDROID_STORE_PASSWORD --key-pass env:ABM_ANDROID_KEY_PASSWORD --out dist/ABM-Mobile-0.2.0-Android-arm64.apk "$RUNNER_TEMP/abm-aligned.apk"
          "$tools/apksigner" verify dist/ABM-Mobile-0.2.0-Android-arm64.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ABM-Mobile-Android-arm64-development
          path: dist/*
          if-no-files-found: error
