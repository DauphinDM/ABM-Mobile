name: Native iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/ios_packaging_test.py
      - run: brew install xcodegen
      - name: Build unsigned arm64 iPhone app
        run: |
          cd ios
          xcodegen generate
          xcodebuild build -project ABMMobile.xcodeproj -scheme ABMMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA for user-side signing
        run: |
          app=build/ios-device/Build/Products/Release-iphoneos/ABMMobile.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.1.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          lipo "$app/ABMMobile" -verify_arch arm64
          # Exercise re-signing and verify bundle integrity without Apple credentials.
          # This ad-hoc signature is NOT an installable Apple provisioning identity.
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$app"
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p build/ios-device-package/Payload dist
          ditto "$app" build/ios-device-package/Payload/ABMMobile.app
          cd build/ios-device-package
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/ABM-Mobile-0.1.0-iOS-arm64-unsigned-build2.ipa"
          cd "$GITHUB_WORKSPACE"
          python3 tests/verify_ios_ipa.py dist/ABM-Mobile-0.1.0-iOS-arm64-unsigned-build2.ipa
          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 ABM-Mobile-0.1.0-iOS-arm64-unsigned-build2.ipa > SHA256SUMS-ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ABM-Mobile-iOS-Unsigned-IPA
          path: |
            dist/ABM-Mobile-0.1.0-iOS-arm64-unsigned-build2.ipa
            dist/SHA256SUMS-ipa
          if-no-files-found: error
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Start isolated TLS fixture
        run: |
          ABM_IOS_COMMAND_MARKER="$RUNNER_TEMP/abm-ios-command-ok" python3 tests/ios_tls_fixture.py > "$RUNNER_TEMP/abm-ios-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/abm-ios-fixture.pid"
          for i in {1..40}; do test -f ios/ABMMobileUITests/Resources/TestConfig.json && break; sleep 0.25; done
          test -f ios/ABMMobileUITests/Resources/TestConfig.json
      - name: Generate project and test native app
        run: |
          cd ios
          xcodegen generate
          xcodebuild test -project ABMMobile.xcodeproj -scheme ABMMobile -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath ../build/ios -resultBundlePath ../build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO
          test -f "$RUNNER_TEMP/abm-ios-command-ok"
      - name: Package simulator app (not an installable iPhone IPA)
        run: |
          app=build/ios/Build/Products/Debug-iphonesimulator/ABMMobile.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.1.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 2
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/ABM-Mobile-0.1.0-iOS-Simulator.zip
          cd dist
          shasum -a 256 ABM-Mobile-0.1.0-iOS-Simulator.zip > SHA256SUMS-ios
      - name: Export simulator screenshots
        if: always()
        run: |
          if test -d build/ios-tests.xcresult; then
            xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path build/ios-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ABM-Mobile-iOS-Simulator
          path: |
            dist/*
            build/ios-tests.xcresult
            build/ios-screenshots
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: test ! -f "$RUNNER_TEMP/abm-ios-fixture.pid" || kill "$(cat "$RUNNER_TEMP/abm-ios-fixture.pid")" || true
