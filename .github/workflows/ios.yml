name: Native iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/ios_packaging_test.py
      - run: brew install xcodegen
      - name: Build unsigned arm64 iPhone app
        run: |
          cd ios
          xcodegen generate
          xcodebuild build -project ABMMobile.xcodeproj -scheme ABMMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA for user-side signing
        run: |
          app=build/ios-device/Build/Products/Release-iphoneos/ABMMobile.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.2.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 5
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          lipo "$app/ABMMobile" -verify_arch arm64
          # Exercise re-signing and verify bundle integrity without Apple credentials.
          # This ad-hoc signature is NOT an installable Apple provisioning identity.
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$app"
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p build/ios-device-package/Payload dist
          ditto "$app" build/ios-device-package/Payload/ABMMobile.app
          cd build/ios-device-package
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/dist/ABM-Mobile-0.2.0-iOS-arm64-unsigned-build5.ipa"
          cd "$GITHUB_WORKSPACE"
          python3 tests/verify_ios_ipa.py dist/ABM-Mobile-0.2.0-iOS-arm64-unsigned-build5.ipa
          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 ABM-Mobile-0.2.0-iOS-arm64-unsigned-build5.ipa > SHA256SUMS-ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ABM-Mobile-iOS-Unsigned-IPA
          path: |
            dist/ABM-Mobile-0.2.0-iOS-arm64-unsigned-build5.ipa
            dist/SHA256SUMS-ipa
          if-no-files-found: error
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Prepare an available iOS simulator
        timeout-minutes: 20
        run: |
          python3 tests/ios_simulator_test.py
          python3 bin/prepare-ios-simulator.py
      - name: Start isolated TLS fixture
        timeout-minutes: 3
        run: |
          ABM_IOS_COMMAND_MARKER="$RUNNER_TEMP/abm-ios-command-ok" python3 tests/ios_tls_fixture.py > "$RUNNER_TEMP/abm-ios-fixture.log" 2>&1 &
          fixture=$!
          echo "$fixture" > "$RUNNER_TEMP/abm-ios-fixture.pid"
          for i in {1..120}; do
            test -f ios/ABMMobileUITests/Resources/TestConfig.json && break
            if ! kill -0 "$fixture" 2>/dev/null; then
              cat "$RUNNER_TEMP/abm-ios-fixture.log"
              echo 'TLS fixture exited before becoming ready.' >&2
              exit 1
            fi
            sleep 0.5
          done
          if ! test -f ios/ABMMobileUITests/Resources/TestConfig.json; then
            cat "$RUNNER_TEMP/abm-ios-fixture.log"
            echo 'TLS fixture did not become ready within the bounded startup wait.' >&2
            exit 1
          fi
      - name: Generate project and test native app
        run: |
          cd ios
          xcodegen generate
          # Ad-hoc simulator identity permits real Keychain tests without Apple credentials.
          # Simulator.entitlements is SDK-scoped and is never used for the device IPA.
          xcodebuild test -project ABMMobile.xcodeproj -scheme ABMMobile -destination "platform=iOS Simulator,id=$ABM_SIMULATOR_ID" -derivedDataPath ../build/ios -resultBundlePath ../build/ios-tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"
          test -f "$RUNNER_TEMP/abm-ios-command-ok"
      - name: Package simulator app (not an installable iPhone IPA)
        run: |
          app=build/ios/Build/Products/Debug-iphonesimulator/ABMMobile.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.2.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 5
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/ABM-Mobile-0.2.0-iOS-Simulator.zip
          cd dist
          shasum -a 256 ABM-Mobile-0.2.0-iOS-Simulator.zip > SHA256SUMS-ios
      - name: Export simulator screenshots
        if: always()
        run: |
          if test -d build/ios-tests.xcresult; then
            xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path build/ios-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ABM-Mobile-iOS-Simulator
          path: |
            dist/*
            build/ios-tests.xcresult
            build/ios-screenshots
            ${{ runner.temp }}/abm-ios-fixture.log
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: test ! -f "$RUNNER_TEMP/abm-ios-fixture.pid" || kill "$(cat "$RUNNER_TEMP/abm-ios-fixture.pid")" || true
      - name: Stop isolated simulator
        if: always()
        run: test -z "$ABM_SIMULATOR_ID" || xcrun simctl shutdown "$ABM_SIMULATOR_ID" || true
